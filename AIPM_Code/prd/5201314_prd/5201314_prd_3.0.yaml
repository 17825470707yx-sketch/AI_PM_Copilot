version: '3.0'
last_updated_by: verification_upgrade
prd_specifications:
  - id: nomenclature
    name: 名词解释
    weight: Must_have
    system_instruction: |
      注意：不要再去解释系统里早就约定俗成的词（比如什么是 Article、什么是 Tag），重点解释本次迭代引入的新概念，或者容易和老概念混淆的词。
      举例：假设需求是“增加文章合集功能”。这里必须明确定义新增的 Series（合集）：它是指由同一作者发布、具有先后阅读顺序的多篇文章的集合，需严格区别于由全站用户共建的 Tag（标签）。
    content: 1. 前端伪静态阅读量：本次迭代前端本地生成的、未对接后端真实统计数据的文章阅读量展示字段，区别于后续迭代上线的后端上报真实统计值；2. 无侵入卡片改造：完全复用原有文章卡片DOM结构、盒模型、布局规则，仅在指定元信息位追加新元素，不改动原有功能逻辑的改造方案；3. 无差展示策略：所有用户看到的阅读量样式、数值完全一致，无登录/访客权限分支的展示规则
  - id: target_users
    name: 目标用户
    weight: Must_have
    system_instruction: |
      注意：要明确指出这个新特性是针对哪一类特定的存量用户，这决定了功能的可见性和权限控制。
      举例：假设需求是“创作者数据周报”。目标用户应界定为：至少发布过1篇文章的 Author。对于从未发过文章的纯 Reader 账号，不展示该入口。
    content: 全量首页访问用户，包含未登录访客、已登录普通用户，无身份层级、用户画像维度的筛选区分，所有首页浏览信息流的用户均覆盖
  - id: user_scenarios
    name: 用户场景
    weight: Must_have
    system_instruction: |
      注意：重点描述用户在现有的哪个老路径上，遇到了什么契机，从而触发了这个新功能。必须交代清楚新老流程的“接口”。
      举例：假设需求是“一键分享生成海报”。场景描述：用户在 App 端阅读完一篇极具启发的长文（现有路径），滑到底部时，点击新增的“生成分享图”按钮（新触点），将包含名言和文章二维码的图片保存到相册，用于发朋友圈。
    content: 1. 用户日常刷首页信息流时，仅能通过点赞数、评论数筛选高互动内容，无法快速识别高曝光但低互动的优质内容，需要多一个热度参考维度快速定位目标内容；2. 用户保留原有刷首页的操作路径，不需要额外点击、跳转，在浏览信息流的过程中直接获取每篇文章的曝光量级信息
  - id: problem_statement
    name: 待解决问题清单
    weight: Must_have
    system_instruction: |
      注意：不要写宏观的业务痛点，而是要把一句话的需求，按照前端 UI、前端逻辑、后端接口、数据库或数据模型的维度，像切土豆丝一样拆分成颗粒度极细的“待办事项”。这部分写得越细，开发在实现时遗漏逻辑的概率就越低。
      举例1：个人主页新增 About Me Tab：在 Profile 页面现有 My Articles / Favorited Articles 之外新增一个 About Me Tab，展示 User.bio；

      待解决问题1（前端-UI）： 在 Profile 页面现有的 My Articles 和 Favorited Articles 旁边，增加一个 About Me 的 Tab，严格复用现有 Tab 栏的 CSS 样式和选中状态（Active State）。
      待解决问题2（前端-路由/逻辑）： 点击 About Me Tab 时，下方的内容展示区需切换为新的视图，不再显示文章列表组件。
      待解决问题3（数据绑定）： 在该视图内，直接读取并渲染当前主页用户的 User.bio 数据。如果 User.bio 为空或 null，需展示空状态文案（如："The user hasn't written a bio yet."）。(注：因 L1 题设说明了只需利用现有字段，所以这里不涉及后端改动)。

      举例2：文章草稿功能：Article 增加 status 枚举（draft/published），编辑器新增“保存草稿”，列表默认过滤 draft，个人主页增加 Drafts Tab 

      待解决问题 1（后端-数据模型）： Article 模型/表中新增 status 字段，设定默认值，其枚举值需包含 draft（草稿）和 published（已发布）。 
      待解决问题 2（后端-读取接口改造）： 修改现有的全局文章列表（Global Feed / Your Feed）接口，强制过滤掉 status=draft 的数据，防止草稿泄露到公共区。 
      待解决问题 3（前端-编辑器页）： 在 /editor 页面现有的“Publish Article”按钮旁，新增一个“Save as Draft”按钮。点击后调用保存接口，并传递 status: 'draft' 参数。 
      待解决问题 4（前端-个人主页）： 在 Profile 页面的 Tab 栏新增一个 Drafts 选项卡，点击后调用接口获取当前用户的草稿列表。 
      待解决问题 5（前端-权限逻辑）： 这个 Drafts Tab 及其内容，必须仅限当前登录用户访问自己的主页时才渲染和可见，访客看别人的主页时不可见。
    content: 前端UI维度：1. 现有首页文章卡片的统计元信息区域缺少阅读量对应的图标+数字展示位；2. 新增元素的样式、间距、色彩未对齐现有统计类元素的全局规范。前端逻辑维度：1. 缺少前端本地生成100-9999区间不重复随机阅读量数值的逻辑；2. 缺少阅读量数值格式化规则：<1000展示原数、≥1000转x.k格式；3. 现有渲染逻辑中未将阅读量元素嵌入原有卡片统计行，易出现布局偏移；4. 未控制仅在组件首次挂载时生成阅读量，避免重渲染导致数值跳动。后端接口维度：本次迭代无后端接口相关待办事项。数据模型维度：本次迭代无数据模型相关待办事项
  - id: in_scope
    name: 需求边界界定 (In-Scope)
    weight: Must_have
    system_instruction: |
      注意：这是迭代需求中最重要的一环。必须精确圈定本次改动波及了哪些老页面、老接口，范围越清晰，开发评估就越准。
      举例：假设需求是“用户主页增加社交媒体链接”。边界界定为：修改 /settings 页面的表单支持输入链接，修改 /profile 页面展示外链图标。不涉及全局导航栏和文章详情页的改动。
    content: 1. 仅覆盖首页文章卡片场景，在现有元信息统计区追加阅读量展示模块；2. 全量访客/已登录用户无差展示阅读量，无权限差异化逻辑；3. 完全复用现有统计元素的样式、字号、色彩、间距、响应式规则，不改动原有卡片DOM结构；4. 前端本地生成符合量级规则的随机伪静态阅读量数据，全程无新增后端请求；5. 新增模块完全不干扰原有点赞、评论标识的所有交互与展示逻辑
  - id: out_of_scope
    name: 非本期需求 (Out-of-Scope)
    weight: Must_have
    system_instruction: |
      注意：用来“防杠”和“防需求蔓延”。明确指出为了控制本次迭代的成本，哪些看似相关的功能我们故意不做。
      举例：假设需求是“用户主页增加社交媒体链接”。非本期需求：本期仅支持填写 Twitter 和 GitHub 链接并展示图标。自定义其他网站链接、自动拉取 Twitter 最新动态等高级功能暂不考虑。
    content: 1. 所有后端相关改造：新增阅读量接口、调整数据表字段、开发阅读量上报逻辑全部排除出本次迭代；2. 非首页场景的阅读量展示：文章详情页、个人中心文章列表、收藏夹列表等其他页面的阅读量需求全部排除；3. 阅读量相关衍生功能：阅读量统计上报、高阅读量文章排序置顶、阅读量动态更新全部排除；4. 新增前端埋点、新增全局状态管理、新增依赖包的相关需求全部排除
  - id: solution_design
    name: 方案设计 (流程与交互)-图片？
    weight: Must_have
    system_instruction: ~
    content: '1. 布局位置：阅读量模块固定放在点赞标识右侧、评论标识左侧，和原有统计元素横向排列；2. 元素结构：复用现有Eye类统计图标+8px间距+12px次级中性灰数字文本，完全复用现有全局样式变量，不新增独立样式类；3. 组件实现：封装无状态纯展示阅读量子组件，直接导入现有ArticleCard组件的统计信息插槽内，入参为空，内部自动生成符合规则的伪静态数据；4. 数据逻辑：组件挂载周期内仅生成一次随机阅读量，后续重渲染不重复生成避免数值跳动，遍历文章列表时给每条文章动态注入阅读量字段，不污染原有接口返回数据结构；5. 布局兜底：将原有统计区flex布局设为justify-content: flex-start，不硬编码区域总宽度，避免原有元素被挤压换行'
  - id: exception_and_empty_states
    name: 异常流程与空状态设计
    weight: Must_have
    system_instruction: |
      注意：明确断网、接口超时、无数据（列表为空/字段值为空）、加载失败、系统报错等异常场景的兜底逻辑。规定前端的交互反馈方式（如 Toast 提示、骨架屏、缺省页占位图、重试按钮）以及具体的引导文案，坚决避免页面白屏或前端逻辑挂死。
      举例：个人主页新增 About Me Tab。在 Profile 页面现有 My Articles / Favorited Articles 之外新增一个 About Me Tab，展示 User.bio；
      1.网络异常：点击 Tab 获取数据超时，Toast 提示“加载信息失败，请稍后重试”。
      2.无数据空状态：若接口返回该用户的 User.bio 为空，需在视图区展示统一的缺省占位图，并配引导文案：“The user hasn't written a bio yet.”。
    content: 1. 断网场景：无任何新增后端请求依赖，完全沿用原有卡片的渲染逻辑，阅读量正常生成展示，无报错；2. 原有文章接口返回异常/空数据场景：阅读量模块完全不影响原有卡片的降级渲染逻辑，若原有卡片触发空态，阅读量模块随原有统计元素同步隐藏；3. 前端JS局部渲染异常场景：阅读量子组件外层加Error Boundary兜底，若组件渲染报错直接隐藏该元素，不影响整张卡片的正常展示；4. 极低分辨率屏幕下触发统计元素自动折行场景：完全复用原有折行规则，阅读量元素随其他统计元素同步自动换行，无溢出异常
  - id: performance_req
    name: 性能与并发要求
    weight: Must_have
    system_instruction: |
      注意：针对高频交互、大数据量加载或复杂计算的新逻辑，明确前端的防御机制与性能阈值。例如：规定长列表的懒加载/分页策略（Limit/Offset 阈值）、高频操作的防抖/节流（Debounce/Throttle）机制、以及纯前端计算的触发时机，确保新特性不拖慢页面的整体渲染。
      举例：评论支持点赞；
      用户连续快速点击心型点赞图标时，前端必须做防抖处理（如 500ms 内的连续点击只向后端发送最后一次请求），同时 UI 必须实现“乐观更新”（先亮起红心），防止因为频繁请求导致页面卡顿或后端收到冗余数据。
    content: 1. 无任何新增后端接口请求，首页核心路径加载耗时增幅严格为0；2. 阅读量模块代码改动量控制在50行以内，不新增第三方依赖，页面JS资源大小无增长；3. 仅在组件首次挂载时生成阅读量，后续重渲染完全复用已生成的数值，无额外计算性能损耗；4. 全量信息流渲染场景下，新增模块不增加首屏渲染耗时，保持原有首屏加载速度完全一致
  - id: compatibility_req
    name: 兼容性与适配规范
    weight: Must_have
    system_instruction: |
      注意：必须兼顾“UI 响应式适配”与“历史存量数据兼容”。UI 层需明确新元素在不同屏幕断点（PC/Tablet/Mobile）的折叠、换行或隐藏规则；数据层需明确，当老数据缺失新字段时，前端的降级展示规则（如默认值占位、文本超长截断省略规则）。
      举例：文章加封面图字段；
      1.UI 适配：在 PC 端（>=768px），封面图展示在卡片右侧（宽高比 16:9）；在移动端（<768px），封面图移至文章标题上方，自适应屏幕宽度。
      2.历史数据兼容：线上存量的老文章数据库中均无 coverImage 数据，前端在列表渲染时，若读取不到该字段，自动收起图片占位区域，保持原有的纯文本卡片样式，绝不允许出现图片加载失败的裂图 Icon。
    content: 1. 新增阅读量模块完全附着在现有文章卡片的元信息区域，不改动原有卡片的盒模型规则，所有原有宽度、padding、margin参数保持不变；2. 全响应式断点下完全适配，阅读量元素完全沿用原有统计区域的布局对齐规则，不出现布局偏移、元素溢出、原有元素被挤压换行的问题；3. 所有存量低版本浏览器兼容：完全复用现有已验证的样式属性，不使用未做兼容的新CSS特性，原有E2E测试用例全部可正常运行；4. 改造后所有设备下文章卡片的宽高占比与改造前完全一致，无任何视觉差异
  - id: security_privacy
    name: 安全、隐私与合规
    weight: Must_have
    system_instruction: |
      注意：聚焦接口层面的防越权（水平/垂直越权校验）、防注入（XSS 等前端安全），以及敏感数据的可见性范围。凡是涉及用户输入的展示，或需要特定身份才能操作的新增接口，必须强制说明鉴权边界，不能只靠前端隐藏按钮。
      举例：文章草稿功能；
      后端必须在草稿详情接口增加强校验。当请求获取 status=draft 的文章时，必须比对当前请求头中的 JWT Token 解析出的 UserID 是否等于该文章的 authorId。如果不等，必须返回 403 或 404 错误，彻底防止用户通过枚举文章 Slug 越权偷看他人的未公开草稿。
    content: 1. 本次迭代无任何新增后端接口、无新增用户数据上报逻辑，不存在接口越权、数据泄露风险；2. 阅读量属于公开统计信息，无敏感数据，全量用户无差展示，不存在隐私违规问题；3. 所有前端生成的伪静态阅读量完全本地闭环，无跨域、注入风险；4. 不新增任何用户浏览行为的采集逻辑，完全符合现有产品隐私合规要求
  - id: acceptance_criteria
    name: 功能走查与验收标准 (UAT)
    weight: Must_have
    system_instruction: |
      注意事项：1.行为驱动格式：放弃“用户可以正常点赞”这种模糊描述，采用 前提条件 (Given) -> 触发动作 (When) -> 预期断言 (Then) 的结构编写，方便开发直接将其翻译为 Arrange -> Act -> Assert 的测试代码。2.断言需量化且客观：预期结果不能只写“页面发生变化”，必须精确到“API 返回 HTTP 200”、“数据库字段 +1”或“DOM 元素出现特定 Class”。3.圈定回归基线（Regression Baseline）：明确指出本次修改绝对不能破坏的系统既有自动化测试套件（如：发文流程、老数据读取），作为开发重构时的安全网。
      举例（以评论支持点赞且要求幂等性为例）：
      UAT 1：正向主流程（对应控制器/接口层测试） 
      Given（假设）：数据库中存在一条 likeCount 为 0 的有效评论，且当前请求携带合法的 User JWT。
      When（当）：调用 POST /api/comments/:id/favorite 接口。
      Then（那么）：接口必须返回 HTTP 200；同时该评论在数据库中的 likeCount 字段变更为 1；返回的 JSON 数据中 comment.favorited 为 true。

      UAT 2：逆向边界/幂等性（对应逻辑层测试）
      Given（假设）：当前登录用户已经对某条评论进行过点赞（数据库中已存在关联记录）。
      When（当）：恶意或因为网络卡顿，再次向 POST /api/comments/:id/favorite 接口发送请求。
      Then（那么）：接口不抛出 500 异常，必须返回成功状态；但该评论的总 likeCount 绝对不能增加（保持原样），数据库也不应产生重复的脏数据。

      UAT 3：前端交互防护（对应前端组件测试）
      Given（假设）：用户处于文章详情页，查看到评论列表。
      When（当）：用户在 500 毫秒内，对同一个“心形点赞图标”连续高频点击 5 次。
      Then（那么）：UI 层面心形图标立刻变为实心红色（乐观更新）；但在浏览器的 Network 面板中，只能捕获到 1 次真实的 API 发出请求（防抖生效）。

      UAT 4：历史数据回归防退化（极其重要）
      回归基线：读取线上半年前发布的、没有 likeCount 字段的老评论数据。
      When（当）：前端渲染这些老评论列表时。
      Then（那么）：老版本的自动化 UI 测试用例必须 100% 保持绿色通过状态；老评论的点赞数应默认展示为 0，绝对不能出现 NaN 或 undefined 导致的页面白屏。
    content: 1. Given 用户正常访问首页信息流 When 页面加载完成 Then 所有文章卡片的点赞标识和评论标识之间正常展示小眼睛图标+符合规则的阅读量数字，样式与相邻点赞、评论元素完全统一；2. Given 同一台设备切换访客/已登录账号 When 刷新首页 Then 对应文章卡片的阅读量展示样式完全一致，无差异化权限分支；3. Given 页面触发局部重渲染（如点赞操作） When 卡片重新渲染 Then 对应阅读量数值不发生变化，无跳动情况；4. Given 切换不同分辨率的设备尺寸 When 页面响应式适配 Then 所有文章卡片的布局无偏移、无元素溢出，原有卡片的宽高与改造前完全一致；5. Given 断网状态下访问首页 When 页面加载 Then 所有阅读量元素正常展示，无报错，不影响原有卡片的渲染逻辑；6. Given 全量灰度上线后 When 观测24小时 Then 首页文章卡片布局偏移率为0，页面加载耗时增幅为0，用户点击高阅读量文章占比较上线前提升15%以上
  - id: repository_goal
    name: ''
    content: ''
    system_instruction: ''
